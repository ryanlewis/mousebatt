[package]
name = "mousebatt"
version = "0.2.0"
edition = "2021"
description = "Tray battery monitor for Pulsar and VAXEE wireless mice"
license = "MIT"
repository = "https://github.com/ryanlewis/mousebatt"
readme = "README.md"
keywords = ["windows", "tray", "battery", "hid", "mouse"]
categories = ["hardware-support", "os::windows-apis"]
rust-version = "1.80"
publish = false

[dependencies.windows-sys]
version = "=0.59.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
